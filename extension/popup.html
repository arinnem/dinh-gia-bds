<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h3>Batdongsan Scraper</h3>
    <div class="form-group">
      <label for="listingCount">Number of listings:</label>
      <input type="number" id="listingCount" value="10" min="1" max="100">
    </div>
    <div class="form-group">
      <label for="delay">Delay between pages (ms):</label>
      <input type="number" id="delay" value="2000" min="1000">
    </div>
    <div class="form-group">
      <label for="saveLocation">Save Location:</label>
      <div class="save-location-container">
        <button id="browseSaveLocation">Browse Save Location</button>
        <div id="saveLocationDisplay" class="save-location-display">Default Downloads folder</div>
      </div>
    </div>
    <div class="button-group">
      <button id="startScraping">Start Scraping</button>
      <button id="stopScraping" disabled>Stop</button>
    </div>
    <div id="status" class="status-box">Ready</div>
    <div id="progress" class="progress-box"></div>
    <div class="progress-bar-container" style="display: none;">
      <div class="progress-bar">
        <div id="progressBar" class="progress-fill"></div>
      </div>
    </div>
